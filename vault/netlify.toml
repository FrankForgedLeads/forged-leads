[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Single-page app: let React Router handle every path client-side. Netlify
# resolves /.netlify/functions/* to Functions before this catch-all runs,
# so it doesn't interfere with notify-lead or the Phase 6 Stripe webhook.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# sw.js must never be served from a long-lived cache — browsers check
# this exact URL for updates, and a stale cached copy (CDN or browser)
# would mean a change to it never reaches anyone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
