<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <!-- iOS doesn't read the manifest for "Add to Home Screen" styling —
         these three tags are what make it launch standalone (no Safari
         chrome) with the right status bar look, same job the manifest
         does for Android/Chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vault" />
    <meta
      name="description"
      content="Beeyond Vault reviews your estimate and supporting documentation together and flags potential scope gaps worth a second look — before you send it. Built for Florida contractors and estimating professionals."
    />
    <title>Beeyond Vault — A second set of eyes for your estimate.</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
